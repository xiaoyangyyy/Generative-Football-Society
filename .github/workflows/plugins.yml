name: plugin-projects

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci-linux-py312.lock
            gfs-core/requirements-linux-py312.lock
            gfs-studio/requirements-linux-py312.lock

      - name: Setup uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.13"
          enable-cache: false

      - name: Install locked test and runtime dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci-linux-py312.lock
          python -m pip install --require-hashes -r gfs-core/requirements-linux-py312.lock
          python -m pip install --require-hashes -r gfs-studio/requirements-linux-py312.lock

      - name: Validate both supply chains
        run: |
          python scripts/build_plugin_supply_chain.py --validate
          python scripts/build_plugin_supply_chain.py

      - name: Test, build, clean-install, and execute both projects
        run: python scripts/verify_release.py --out build/plugin-release-verification.json

      - name: Upload release verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-release-verification
          if-no-files-found: error
          retention-days: 30
          path: build/plugin-release-verification.json

  container-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Build and execute versioned plugin containers
        run: python scripts/verify_plugin_containers.py --execute --out build/plugin-container-verification.json

      - name: Attest container evidence
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: build/plugin-container-verification.json

      - name: Upload container verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-container-verification
          if-no-files-found: error
          retention-days: 30
          path: build/plugin-container-verification.json
