name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile project
        run: |
          python -m compileall -q src scripts

      - name: Release boundary
        run: |
          python scripts/audit_release_boundary.py

      - name: Test suite
        run: |
          python -m pytest -q

      - name: Frozen release integrity
        run: |
          python scripts/verify_acceptance.py
          python scripts/verify_release_manifest.py data/releases/v6.0.0.json
          python scripts/verify_v7_release.py --artifacts-only
          python scripts/verify_release_manifest.py data/releases/v8.9.0-candidate.json
          python scripts/verify_temporal_lopo_v89.py
          python scripts/verify_release_manifest.py data/releases/v9.0.0-candidate.json
          python scripts/verify_continuous_v90.py
          python scripts/verify_continuous_v92.py
          python scripts/verify_continuous_v93.py
          python scripts/verify_continuous_v94.py
          python scripts/verify_continuous_v95.py
          python scripts/verify_continuous_v96.py
          python scripts/verify_continuous_v97.py
          python scripts/verify_large_shadow_v98.py
          python scripts/verify_strict_mirror_v99.py
