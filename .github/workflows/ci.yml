name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            requirements-linux-py312.lock
            requirements-ci-linux-py312.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-linux-py312.lock
          python -m pip install --require-hashes -r requirements-ci-linux-py312.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Source health
        run: |
          python -m ruff check src
          python -m ruff check src/product/web.py src/match_engine/action_engine.py --select C901,PLR0912,PLR0915
          python -m ruff check scripts/action_adoption_study.py scripts/run_formal_experiment.py
          python -m ruff check scripts/action_adoption_study.py scripts/run_formal_experiment.py --select C901,PLR0912,PLR0915

      - name: Compile project
        run: |
          python -m compileall -q src scripts

      - name: Release boundary
        run: |
          python scripts/audit_release_boundary.py

      - name: Supply-chain and runtime audits
        run: |
          python scripts/verify_reproducibility_matrix.py
          python scripts/verify_container_images.py
          python scripts/verify_local_runtime.py

      - name: Test suite
        run: |
          python -m pytest -q tests \
            --deselect tests/test_world_model_semantic_event_training.py::test_trainer_persists_real_one_and_two_step_event_evidence

      - name: Frozen release integrity
        run: |
          python scripts/verify_acceptance.py
          python scripts/verify_release_manifest.py data/releases/v6.0.0.json
          python scripts/verify_v7_release.py --artifacts-only
          python scripts/verify_release_manifest.py data/releases/v8.9.0-candidate.json
          python scripts/verify_temporal_lopo_v89.py
          python scripts/verify_release_manifest.py data/releases/v9.0.0-candidate.json
          python scripts/verify_continuous_v90.py
          python scripts/verify_continuous_v92.py
          python scripts/verify_continuous_v93.py
          python scripts/verify_continuous_v94.py
          python scripts/verify_continuous_v95.py
          python scripts/verify_continuous_v96.py
          python scripts/verify_continuous_v97.py
          python scripts/verify_large_shadow_v98.py
          python scripts/verify_strict_mirror_v99.py

  pinned-container-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Build and verify pinned read-only container
        run: |
          python scripts/verify_container_runtime.py --execute --out data/evaluation/container_runtime_verification_v1.json
          python scripts/verify_deployment_contract.py --out data/evaluation/deployment_contract_ci_verification_v1.json
          python -c "import json; p=json.load(open('data/evaluation/deployment_contract_ci_verification_v1.json')); assert p['image_built'] and p['deployment_started']"

      - name: Attest container evidence
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            data/evaluation/container_runtime_verification_v1.json
            data/evaluation/deployment_contract_ci_verification_v1.json

      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-runtime-verification
          if-no-files-found: error
          retention-days: 30
          path: |
            data/evaluation/container_runtime_verification_v1.json
            data/evaluation/deployment_contract_ci_verification_v1.json
