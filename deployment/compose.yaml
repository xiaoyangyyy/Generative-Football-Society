name: gfs-plugin-workspace

services:
  core:
    build:
      context: ../gfs-core
      dockerfile: Dockerfile
    image: gfs-core:latest
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - core_persistence:/app/data/persistence
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    restart: unless-stopped

  studio:
    build:
      context: ../gfs-studio
      dockerfile: Dockerfile
    image: gfs-studio:latest
    depends_on:
      - core
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - studio_persistence:/app/data/persistence
      - studio_backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  backend:
    internal: true

volumes:
  core_persistence: {}
  studio_persistence: {}
  studio_backups: {}
