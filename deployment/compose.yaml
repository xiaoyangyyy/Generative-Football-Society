name: gfs-plugin-workspace

services:
  studio:
    build:
      context: ../gfs-studio
      dockerfile: Dockerfile
      args:
        CORE_IMAGE: gfs-core:7.0.0a1
    image: gfs-studio:0.1.0a1
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    volumes:
      - studio_persistence:/app/data/persistence
      - studio_backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)); assert payload['status'] == 'ok' and payload['transport'] == 'loopback'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    pids_limit: 256

networks:
  backend:
    internal: true

volumes:
  studio_persistence: {}
  studio_backups: {}
