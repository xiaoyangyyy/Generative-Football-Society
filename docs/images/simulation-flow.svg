<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">比赛动力学与状态流</title>
  <desc id="desc">从球队数据到宏观或微观执行、比分来源、记忆和后续工作流。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52677d"/>
    </marker>
  </defs>
  <rect width="1200" height="500" rx="22" fill="url(#bg2)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#16283d">从数据到下一场比赛</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" text-anchor="middle">
    <rect x="35" y="110" width="160" height="78" rx="12" fill="#e5f3ff" stroke="#2794c7" stroke-width="2"/>
    <text x="115" y="143" fill="#173a5e">球队与数据</text><text x="115" y="170" fill="#52677d">排名 · 阵容 · 战术</text>
    <rect x="230" y="110" width="160" height="78" rx="12" fill="#e5f3ff" stroke="#2794c7" stroke-width="2"/>
    <text x="310" y="143" fill="#173a5e">球队画像</text><text x="310" y="170" fill="#52677d">记忆与跨场状态</text>
    <rect x="425" y="110" width="160" height="78" rx="12" fill="#e5f3ff" stroke="#2794c7" stroke-width="2"/>
    <text x="505" y="143" fill="#173a5e">match-workflow</text><text x="505" y="170" fill="#52677d">统一比赛装配</text>
    <rect x="620" y="85" width="220" height="60" rx="10" fill="#e4faf1" stroke="#2b9b83" stroke-width="2"/>
    <text x="730" y="122" fill="#15483e">macro engine</text>
    <rect x="620" y="160" width="220" height="60" rx="10" fill="#e4faf1" stroke="#2b9b83" stroke-width="2"/>
    <text x="730" y="197" fill="#15483e">micro engine</text>
    <rect x="875" y="110" width="285" height="78" rx="12" fill="#fff1df" stroke="#d9822b" stroke-width="2"/>
    <text x="1017" y="143" fill="#78410a">比分来源可审计</text><text x="1017" y="170" fill="#855b25">scheduled · physics · hybrid</text>
    <rect x="230" y="300" width="180" height="78" rx="12" fill="#e4faf1" stroke="#2b9b83" stroke-width="2"/>
    <text x="320" y="333" fill="#15483e">比赛摘要</text><text x="320" y="360" fill="#52677d">xG · 传球 · 射门 · 情绪</text>
    <rect x="460" y="300" width="180" height="78" rx="12" fill="#e5f3ff" stroke="#2794c7" stroke-width="2"/>
    <text x="550" y="333" fill="#173a5e">checkpoint</text><text x="550" y="360" fill="#52677d">状态哈希 · 确定性恢复</text>
    <rect x="690" y="300" width="180" height="78" rx="12" fill="#e4faf1" stroke="#2b9b83" stroke-width="2"/>
    <text x="780" y="333" fill="#15483e">社会记忆</text><text x="780" y="360" fill="#52677d">疲劳 · 士气 · 关系</text>
    <rect x="920" y="300" width="240" height="78" rx="12" fill="#f0e9ff" stroke="#7a5ac7" stroke-width="2"/>
    <text x="1040" y="333" fill="#42316e">研究与产品</text><text x="1040" y="360" fill="#65528e">候选评估 · cohort · 下一场</text>
  </g>
  <g stroke="#52677d" stroke-width="3" fill="none" marker-end="url(#arrow2)">
    <path d="M195 149 H225"/><path d="M390 149 H420"/><path d="M585 149 H615"/><path d="M840 149 H870"/>
    <path d="M730 220 V255 H550 V295"/><path d="M730 145 V255 H550"/>
    <path d="M730 220 V255 H780 V295"/><path d="M730 145 V255 H780 V295"/>
    <path d="M410 339 H455"/><path d="M640 339 H685"/><path d="M870 339 H915"/>
  </g>
  <rect x="210" y="425" width="780" height="45" rx="10" fill="#ffffff" stroke="#b9c9da"/>
  <text x="600" y="454" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#52677d">真实执行与模型预测分开记录；历史回放显式限制 memory_as_of</text>
</svg>
